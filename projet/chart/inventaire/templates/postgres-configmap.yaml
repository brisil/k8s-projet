{{- $c := dict "ctx" . "component" "postgres" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inventaire.componentName" $c }}
  labels:
    {{- include "inventaire.labels" $c | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  PGDATA: /var/lib/postgresql/data/pgdata
